# Modern 2025 Theme - Gris/Argenté/Vert Manjaro
# Colors for i3, polybar, rofi, and dunst

# Base colors
set $bg-primary      #1a1a1a    # Fond principal très sombre
set $bg-secondary    #2d2d2d    # Surfaces secondaires
set $bg-tertiary     #404040    # Bordures et éléments tertiaires
set $bg-accent       #16a085    # Accent vert Manjaro

# Text colors
set $text-primary    #c0c0c0    # Texte principal argenté
set $text-secondary  #a0a0a0    # Texte secondaire
set $text-muted      #808080    # Texte atténué
set $text-accent     #1abc9c    # Texte accent vert clair

# Status colors
set $status-urgent   #e74c3c    # Rouge pour les alertes
set $status-warning  #f39c12    # Orange pour les avertissements
set $status-success  #27ae60    # Vert pour le succès
set $status-info     #3498db    # Bleu pour les informations

# Border colors
set $border-focused  #16a085    # Bordure fenêtre active (vert Manjaro)
set $border-unfocused #404040   # Bordure fenêtre inactive
set $border-urgent   #e74c3c    # Bordure fenêtre urgente

# Transparency
set $transparency    0.75       # Transparence générale 